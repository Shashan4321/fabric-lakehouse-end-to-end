name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint Python + Spark SQL
        run: make lint
      - name: Build medallion layers and run the data-quality gate
        run: make landing run
      - name: Tests
        run: pytest -q
