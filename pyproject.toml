[project]
name = "fabric-lakehouse-end-to-end"
version = "0.1.0"
description = "Microsoft Fabric medallion lakehouse (OneLake -> Lakehouse -> Warehouse -> Direct Lake) for supply-chain analytics; SQL tested locally on DuckDB."
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3", "pre-commit>=3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["fabric/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
